# Curated corpus targets for the CropWatch knowledge layer (technicaldoc §7).
#
# The fetcher requests only these URLs (plus robots.txt and Wayback snapshots); it is not a
# crawler. Add a document here, then run: pnpm --filter @repo/corpus fetch-corpus --only <id>
#
# tier: 1 MoA · 2 ZARI · 3 ZMD · 4 FAO · 5 CABI · 6 research. Lower wins on conflict.
# priority: true marks the eight documents the D4 gate counts.
# licence: as stated by the publisher; "(unconfirmed)" where we could not read it ourselves.
# Doses in any document are context only: recommendations take doses from registered_products.

sources:
