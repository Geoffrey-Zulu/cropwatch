name: Build Phytos iOS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Simulator or unsigned IPA need no secrets; signed exports need Apple credentials
        type: choice
        default: simulator
        options:
          - simulator
          - unsigned-ipa
          - app-store-connect
          - release-testing

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install pinned pnpm CLI through npm
        run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - name: Type check, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Compile iOS app
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUILD_MODE: ${{ inputs.mode }}
        run: bash scripts/build-ios.sh "$BUILD_MODE"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phytos-iOS-${{ inputs.mode }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/phytos-ios/Phytos-simulator.zip
            ${{ runner.temp }}/phytos-ios/export/*.ipa
